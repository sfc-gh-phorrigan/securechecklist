[project]
name = "security-features-checklist"
version = "0.4.0"
description = "Snowflake Security Features Checklist notebook"
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
]

# Core packages required to launch and run notebooks
# Dependency version minimums based on Snowflake CPU Container Runtime Version 2.6 (Python 3.10)
dependencies = [
    "jupyterlab>=4.5.7",
    "ipykernel>=7.2.0"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]   # import sorting, likely bugs, modern syntax

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "T20"]         # long SQL strings, print() for output
